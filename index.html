<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo-Catter — Neighborhood Cat Tracker</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
      /* --- EVERYTHING I LOVE STYLE --- */
header {
    /* Multi-color gradient inspired by vibrant pop art */
    background: linear-gradient(135deg, #FF6B6B, #FFDE00, #00A896, #8338EC);
    background-size: 400% 400%;
    animation: gradientShift 10s ease infinite;
    
    color: #FFFFFF;
    padding: 25px;
    text-align: center;
    border-bottom: 6px solid #000; /* Extra thick border for pop art */
    position: relative;
    z-index: 1000;
}

@keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

h1 { 
    margin: 0;
    font-size: 3.5rem;
    text-transform: uppercase;
    font-weight: 900;
    letter-spacing: -1px;
    /* Heavy black outline for maximum contrast */
    -webkit-text-stroke: 2px #000; 
    text-shadow: 5px 5px 0px #000;
    color: #FFF;
    display: inline-block;
}
    </style>
</head>
<body>
/* Fixes the map container height */
html, body {
    height: 100%;
    margin: 0;
    padding: 0;
}

#map-container { 
    display: flex;
    flex-direction: column;
    height: 100vh; /* Ensures the container fills the viewport */
}
    <header>
        <h1>Geo-Catter 🐾</h1>
    </header>

    <div id="map-container">
        <div id="map"></div>
        <button id="locate-btn" onclick="locateUser()">📍 Find Me</button>
        <button class="add-cat-btn" id="add-btn" onclick="togglePlacingCat()">+</button>
    </div>

    <div id="modal-overlay" class="hidden"></div>
    <div id="add-cat-modal" class="hidden">
        <h2>Spot a Cat? 🐈</h2>
        <div class="form-group"><input type="text" id="cat-name" placeholder="Cat's Name (or 'Unknown')"></div>
        <div class="form-group"><textarea id="cat-notes" placeholder="Color, markings, behavior..."></textarea></div>
        <div class="form-group">
            <input type="file" id="cat-photo" accept="image/*">
            <input type="hidden" id="photoData">
        </div>
        <div class="modal-buttons">
            <button class="cancel-btn" onclick="closeModal()">Cancel</button>
            <button class="save-btn" onclick="saveCatToDatabase()">Save to Database</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDP1rbmCKV6gvvD5ZOa0ckwj1t7QvtwnsI",
            authDomain: "geo-catter.firebaseapp.com",
            databaseURL: "https://geo-catter-default-rtdb.firebaseio.com",
            projectId: "geo-catter",
            storageBucket: "geo-catter.firebasestorage.app",
            messagingSenderId: "465715371916",
            appId: "1:465715371916:web:9b145d2476f3103e1c80a9",
            measurementId: "G-1QK9CL0TK0"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        var map = L.map('map', { zoomControl: false }).setView([33.767433, -84.333119], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
// --- DEFINE CUSTOM CAT ICON ---
        var catIcon = L.icon({
            iconUrl: 'https://i.ibb.co/9mCTPf4V/Chat-GPT-Image-May-24-2026-05-15-02-PM.png', // You can change this URL to any icon you like!
            iconSize: [30, 30], // Size of the icon
            iconAnchor: [20, 40], // Point of the icon which will correspond to marker's location
            popupAnchor: [0, -40] // Point from which the popup should open relative to the iconAnchor
        });
        // --- NEW TARGETING LOGIC ---
        let isPlacingCat = false;
        let pendingLat = null;
        let pendingLng = null;

        function togglePlacingCat() {
            let btn = document.getElementById('add-btn');
            
            // If we are NOT currently placing a cat, turn Targeting Mode ON
            if (!isPlacingCat) {
                isPlacingCat = true;
                document.getElementById('map-container').classList.add('targeting-mode');
                btn.innerHTML = '✖'; // Change icon to a cancel X
                btn.style.backgroundColor = '#95A5A6'; // Grey it out
            } 
            // If we ARE placing a cat and change our mind, turn it OFF
            else {
                cancelPlacingCat();
            }
        }

        function cancelPlacingCat() {
            isPlacingCat = false;
            document.getElementById('map-container').classList.remove('targeting-mode');
            let btn = document.getElementById('add-btn');
            btn.innerHTML = '+';
            btn.style.backgroundColor = 'var(--coral)';
        }

        // The Map Click Listener: This triggers when you click the map!
        map.on('click', function(e) {
            // Only drop a pin if they clicked the "+" button first
            if (isPlacingCat) {
                pendingLat = e.latlng.lat;
                pendingLng = e.latlng.lng;
                
                cancelPlacingCat(); // Reset the UI button
                openModal(); // Pop open the form!
            }
        });
        // ---------------------------

        function openModal() {
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('add-cat-modal').classList.remove('hidden');
        }
       
        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
            document.getElementById('add-cat-modal').classList.add('hidden');
            document.getElementById('cat-name').value = '';
            document.getElementById('cat-notes').value = '';
            document.getElementById('cat-photo').value = '';
            document.getElementById('photoData').value = ''; 
        }

        // --- UPDATED CLOUD SAVE FUNCTION ---
        function saveCatToDatabase() {
            let catName = document.getElementById('cat-name').value || 'Mystery Cat';
            let catNotes = document.getElementById('cat-notes').value || 'No notes.';
            let photoData = document.getElementById('photoData').value;
            
            let newCatData = {
                name: catName,
                notes: catNotes,
                photo: photoData,
                // We now use pendingLat/Lng instead of map.getCenter!
                lat: pendingLat || map.getCenter().lat, 
                lng: pendingLng || map.getCenter().lng
            };

            database.ref('cats').push(newCatData)
                .then(() => {
                    console.log("Hooray! Cat saved to the cloud database!");
                    closeModal();
                })
                .catch((error) => {
                    console.error("Uh oh, something went wrong:", error);
                });
        }

        // --- CLOUD READER ---
        database.ref('cats').on('child_added', function(snapshot) {
            let catData = snapshot.val(); 

            let marker = L.marker([catData.lat, catData.lng], {icon: catIcon}).addTo(map);

            let popupHTML = `
                <div style="text-align: center; font-family: 'Fredoka', sans-serif;">
                    <h3 style="margin: 0 0 5px 0; color: #00A896;">${catData.name}</h3>
                    <img src="${catData.photo}" style="width: 150px; border-radius: 8px; border: 2px solid #2F3E46;">
                    <p style="margin: 5px 0 0 0;">${catData.notes}</p>
                </div>
            `;

            marker.bindPopup(popupHTML);
        });

        // --- THE SHRINK-RAY CODE ---
        document.getElementById('cat-photo').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = 280; 
                    canvas.height = (img.height / img.width) * 280;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.5); 
                    document.getElementById('photoData').value = dataUrl;
                }
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // --- GEOLOCATION: FIND THE USER ---
        function locateUser() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    let userLat = position.coords.latitude;
                    let userLng = position.coords.longitude;
                    
                    map.flyTo([userLat, userLng], 17, { animate: true, duration: 1.5 });
                    
                    L.marker([userLat, userLng]).addTo(map)
                        .bindPopup("<b style='font-family: Fredoka'>📍 You are here!</b>")
                        .openPopup();
                        
                }, function(error) {
                    console.error("Geolocation failed:", error);
                    alert("Couldn't find your location. Make sure you allowed location permissions!");
                });
            } else {
                alert("Your browser doesn't support geolocation.");
            }
        }
    </script>
</body>
</html>
