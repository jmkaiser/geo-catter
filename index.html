<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo-Catter — Neighborhood Cat Tracker</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* --- CORE LAYOUT --- */
        :root {
            --coral: #FF6B6B;
            --mint: #00A896;
            --dark: #2F3E46;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- POP ART HEADER --- */
        header {
            background: linear-gradient(135deg, #FF6B6B, #FFDE00, #00A896, #8338EC);
            background-size: 400% 400%;
            animation: gradientShift 10s ease infinite;
            color: #FFFFFF;
            padding: 20px;
            text-align: center;
            border-bottom: 6px solid #000;
            position: relative;
            z-index: 1000;
            flex-shrink: 0;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 { 
            margin: 0;
            font-size: 3rem;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: -1px;
            -webkit-text-stroke: 2px #000; 
            text-shadow: 5px 5px 0px #000;
            color: #FFF;
            display: inline-block;
        }

        /* --- MAP CONTAINER --- */
        #map-container { 
            flex-grow: 1;
            position: relative;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* --- UI BUTTONS ON MAP --- */
        #locate-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            padding: 12px 20px;
            background-color: var(--mint);
            color: white;
            border: 3px solid #000;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 8px;
            box-shadow: 3px 3px 0px #000;
            cursor: pointer;
            transition: transform 0.1s;
        }

        #add-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            width: 60px;
            height: 60px;
            font-size: 2rem;
            background-color: var(--coral);
            color: white;
            border: 3px solid #000;
            border-radius: 50%;
            box-shadow: 4px 4px 0px #000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        #locate-btn:active, #add-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000;
        }

        .targeting-mode #map {
            cursor: crosshair !important;
        }

        /* --- MODALS & FORMS --- */
        .hidden {
            display: none !important;
        }

        #modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2000;
        }

        #add-cat-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 25px;
            border: 4px solid #000;
            border-radius: 16px;
            z-index: 2001;
            box-shadow: 6px 6px 0px #000;
            width: 90%;
            max-width: 400px;
            box-sizing: border-box;
        }

        #add-cat-modal h2 {
            margin-top: 0;
            color: var(--dark);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group input[type="text"], 
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #000;
            border-radius: 8px;
            font-family: 'Fredoka', sans-serif;
            box-sizing: border-box;
        }

        .form-group textarea {
            height: 80px;
            resize: none;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .modal-buttons button {
            padding: 10px 20px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            border: 2px solid #000;
            border-radius: 8px;
            cursor: pointer;
        }

        .cancel-btn { background: #FF9F1C; color: white; }
        .save-btn { background: var(--mint); color: white; }

        /* --- POPUP DELETE BUTTON --- */
        .delete-btn {
            background-color: var(--coral);
            color: white;
            border: 2px solid #000;
            border-radius: 6px;
            padding: 6px 12px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            box-shadow: 2px 2px 0px #000;
            transition: transform 0.1s;
        }
        .delete-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px #000;
        }
    </style>
</head>
<body>

    <header>
        <h1>Geo-Catter 🐾</h1>
    </header>

    <div id="map-container">
        <div id="map"></div>
        <button id="locate-btn" onclick="locateUser()">📍 Find Me</button>
        <button class="add-cat-btn" id="add-btn" onclick="togglePlacingCat()">+</button>
    </div>

    <div id="modal-overlay" class="hidden"></div>
    <div id="add-cat-modal" class="hidden">
        <h2>Spot a Cat? 🐈</h2>
        <div class="form-group"><input type="text" id="cat-name" placeholder="Cat's Name (or 'Unknown')"></div>
        <div class="form-group"><textarea id="cat-notes" placeholder="Color, markings, behavior..."></textarea></div>
        <div class="form-group">
            <input type="file" id="cat-photo" accept="image/*">
            <input type="hidden" id="photoData">
        </div>
        <div class="modal-buttons">
            <button class="cancel-btn" onclick="closeModal()">Cancel</button>
            <button class="save-btn" onclick="saveCatToDatabase()">Save</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDP1rbmCKV6gvvD5ZOa0ckwj1t7QvtwnsI",
            authDomain: "geo-catter.firebaseapp.com",
            databaseURL: "https://geo-catter-default-rtdb.firebaseio.com",
            projectId: "geo-catter",
            storageBucket: "geo-catter.firebasestorage.app",
            messagingSenderId: "465715371916",
            appId: "1:465715371916:web:9b145d2476f3103e1c80a9",
            measurementId: "G-1QK9CL0TK0"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Focused straight on the heart of the action
        var map = L.map('map', { zoomControl: false }).setView([33.767433, -84.333119], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Updated with your requested permanent icon URL!
        var catIcon = L.icon({
            iconUrl: 'https://i.ibb.co/9mCTPf4V/Chat-GPT-Image-May-24-2026-05-15-02-PM.png', 
            iconSize: [40, 40], 
            iconAnchor: [20, 40], 
            popupAnchor: [0, -40] 
        });

        let catMarkers = {};
        let isPlacingCat = false;
        let pendingLat = null;
        let pendingLng = null;

        function togglePlacingCat() {
            let btn = document.getElementById('add-btn');
            
            if (!isPlacingCat) {
                isPlacingCat = true;
                document.getElementById('map-container').classList.add('targeting-mode');
                btn.innerHTML = '✖'; 
                btn.style.backgroundColor = '#95A5A6'; 
            } else {
                cancelPlacingCat();
            }
        }

        function cancelPlacingCat() {
            isPlacingCat = false;
            document.getElementById('map-container').classList.remove('targeting-mode');
            let btn = document.getElementById('add-btn');
            btn.innerHTML = '+';
            btn.style.backgroundColor = 'var(--coral)';
        }

        map.on('click', function(e) {
            if (isPlacingCat) {
                pendingLat = e.latlng.lat;
                pendingLng = e.latlng.lng;
                
                cancelPlacingCat(); 
                openModal(); 
            }
        });

        function openModal() {
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('add-cat-modal').classList.remove('hidden');
        }
       
        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
            document.getElementById('add-cat-modal').classList.add('hidden');
            document.getElementById('cat-name').value = '';
            document.getElementById('cat-notes').value = '';
            document.getElementById('cat-photo').value = '';
            document.getElementById('photoData').value = ''; 
        }

        function saveCatToDatabase() {
            let catName = document.getElementById('cat-name').value || 'Mystery Cat';
            let catNotes = document.getElementById('cat-notes').value || 'No notes.';
            let photoData = document.getElementById('photoData').value;
            
            let newCatData = {
                name: catName,
                notes: catNotes,
                photo: photoData,
                lat: pendingLat || map.getCenter().lat, 
                lng: pendingLng || map.getCenter().lng
            };

            database.ref('cats').push(newCatData)
                .then(() => closeModal())
                .catch((error) => console.error("Uh oh, something went wrong:", error));
        }

        database.ref('cats').on('child_added', function(snapshot) {
            let catData = snapshot.val(); 
            let catId = snapshot.key; 

            let marker = L.marker([catData.lat, catData.lng], {icon: catIcon}).addTo(map);
            catMarkers[catId] = marker;

            let popupHTML = `
                <div style="text-align: center; font-family: 'Fredoka', sans-serif; min-width: 160px;">
                    <h3 style="margin: 0 0 5px 0; color: #00A896; font-size: 1.2rem;">${catData.name}</h3>
                    ${catData.photo ? `<img src="${catData.photo}" style="width: 150px; border-radius: 8px; border: 2px solid #2F3E46; margin-bottom: 5px;">` : ''}
                    <p style="margin: 5px 0; font-size: 0.9rem; color: #555;">${catData.notes}</p>
                    <button class="delete-btn" onclick="deleteCat('${catId}')">🗑️ Remove Pin</button>
                </div>
            `;

            marker.bindPopup(popupHTML);
        });

        function deleteCat(catId) {
            if(confirm("Are you sure you want to remove this cat alignment?")) {
                database.ref('cats/' + catId).remove()
                    .catch((error) => console.error("Error deleting cat: ", error));
            }
        }

        database.ref('cats').on('child_removed', function(snapshot) {
            let catId = snapshot.key;
            if (catMarkers[catId]) {
                map.removeLayer(catMarkers[catId]);
                delete catMarkers[catId];
            }
        });

        document.getElementById('cat-photo').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = 280; 
                    canvas.height = (img.height / img.width) * 280;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.5); 
                    document.getElementById('photoData').value = dataUrl;
                }
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function locateUser() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    let userLat = position.coords.latitude;
                    let userLng = position.coords.longitude;
                    
                    map.flyTo([userLat, userLng], 17, { animate: true, duration: 1.5 });
                    
                    L.marker([userLat, userLng]).addTo(map)
                        .bindPopup("<b style='font-family: Fredoka'>📍 You are here!</b>")
                        .openPopup();
                        
                }, function(error) {
                    console.error("Geolocation failed:", error);
                    alert("Couldn't find your location. Make sure you allowed location permissions!");
                });
            } else {
                alert("Your browser doesn't support geolocation.");
            }
        }
    </script>
</body>
</html>
