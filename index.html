<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Test</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* Force the page and map to take up the exact full screen */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #e0edd4; /* Your green fallback color */
        }
        #map {
            height: 100vh;
            width: 100vw;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Initialize the map centered on your exact coordinates
        var map = L.map('map').setView([33.767433, -84.333119], 15);

        // 2. Pull in the visual map tiles from OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // 3. Drop a single test pin in the center so we know scripts are running
        L.marker([33.767433, -84.333119]).addTo(map)
            .bindPopup("<b>Success!</b><br>Leaflet is rendering perfectly.")
            .openPopup();
    </script>
</body>
</html>
