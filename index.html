<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo-Catter — Neighborhood Cat Tracker</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --coral: #FF6B6B;
            --teal: #00A896;
            --amber: #F9A620;
            --dark: #2F3E46;
            --light: #F4F7F6;
            --white: #FFFFFF;
            --border-thick: 3px solid var(--dark);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', sans-serif;
            background-color: var(--light);
            color: var(--dark);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: var(--teal);
            color: var(--white);
            padding: 15px 20px;
            text-align: center;
            border-bottom: var(--border-thick);
            z-index: 1000;
        }

        h1 { margin: 0; font-size: 1.8rem; letter-spacing: 1px; }

        #map-container {
            flex-grow: 1;
            position: relative;
        }

        #map { width: 100%; height: 100%; }

        /* Floating Action Button */
        .add-cat-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background-color: var(--coral);
            color: var(--dark);
            border: var(--border-thick);
            border-radius: 50%;
            width: 65px;
            height: 65px;
            font-size: 2.5rem;
            font-family: 'Fredoka', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 6px 0 var(--dark);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .add-cat-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--dark);
        }

        /* --- NEW MODAL STYLES --- */
        .hidden { display: none !important; }

        #modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(47, 62, 70, 0.7);
            z-index: 1500; /* Above the map and FAB */
        }

        #add-cat-modal {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--white);
            padding: 25px;
            border: var(--border-thick);
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            z-index: 2000; /* Topmost layer */
            box-shadow: 0 8px 0 var(--dark);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #add-cat-modal h2 {
            margin: 0;
            color: var(--teal);
            font-size: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group input, .form-group textarea {
            font-family: 'Fredoka', sans-serif;
            padding: 10px;
            border: 2px solid var(--dark);
            border-radius: 8px;
            font-size: 1rem;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            border: 2px solid var(--dark);
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--dark);
        }

        .modal-buttons button:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .cancel-btn { background: var(--light); color: var(--dark); }
        .save-btn { background: var(--amber); color: var(--dark); }
    </style>
</head>
<body>

    <header>
        <h1>Geo-Catter 🐾</h1>
    </header>

    <div id="map-container">
        <div id="map"></div>
        <button class="add-cat-btn" onclick="openModal()">+</button>
    </div>

    <div id="modal-overlay" class="hidden"></div>

    <div id="add-cat-modal" class="hidden">
        <h2>Spot a Cat? 🐈</h2>
        
        <div class="form-group">
            <input type="text" id="cat-name" placeholder="Cat's Name (or 'Unknown')">
        </div>
        
        <div class="form-group">
            <textarea id="cat-notes" placeholder="Color, markings, behavior..."></textarea>
        </div>
        
        <div class="form-group">
            <input type="file" id="cat-photo" accept="image/*">
        </div>
        
        <div class="modal-buttons">
            <button class="cancel-btn" onclick="closeModal()">Cancel</button>
            <button class="save-btn" onclick="saveDummyCat()">Drop Pin</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Initialize Map
        var map = L.map('map', { zoomControl: false }).setView([33.767433, -84.333119], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // --- NEW MODAL JAVASCRIPT ---
        
        function openModal() {
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('add-cat-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
            document.getElementById('add-cat-modal').classList.add('hidden');
            
            // Clear out the form when closed
            document.getElementById('cat-name').value = '';
            document.getElementById('cat-notes').value = '';
            document.getElementById('cat-photo').value = '';
        }

        function saveDummyCat() {
            // 1. Get the name they typed (or default to Mystery Cat)
            let catName = document.getElementById('cat-name').value || 'Mystery Cat';
            
            // 2. Find exactly where the map is currently looking
            let currentCenter = map.getCenter();
            
            // 3. Drop a local marker there (disappears when you refresh, but proves UI works)
            L.marker([currentCenter.lat, currentCenter.lng]).addTo(map)
                .bindPopup(`<b style='font-family: Fredoka'>${catName}</b><br>Meow!`)
                .openPopup();
                
            // 4. Close the modal
            closeModal();
        }

        // Add this to your script section
document.getElementById('cat-photo').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const max_size = 280; 
            
            // Maintain aspect ratio
            if (width > height) {
                if (width > max_size) { height *= max_size / width; width = max_size; }
            } else {
                if (height > max_size) { width *= max_size / height; height = max_size; }
            }
            
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            
            // This compresses the image to a JPEG string
            const dataUrl = canvas.toDataURL('image/jpeg', 0.5); 
            
            // Store it in a hidden input so we can grab it later when saving to Firebase
            // Make sure to add <input type="hidden" id="photoData"> in your modal HTML
            document.getElementById('photoData').value = dataUrl;
        }
        img.src = event.target.result;
    };
    reader.readAsDataURL(file);
});
    </script>
</body>
</html>
